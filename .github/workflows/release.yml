# Creates a GitHub release with the APK attached whenever a version tag (v1.2, v1.3, ...) is pushed.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/ShadeWidget.apk \
            --title "Shade Widget ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md --latest
