# Publishes a GitHub release with the APK attached whenever dist/ShadeWidget.apk changes on main.
# The version number comes from versionName in AndroidManifest.xml.
name: Release
on:
  push:
    branches: [main]
    paths:
      - dist/ShadeWidget.apk
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'android:versionName="\K[^"]+' AndroidManifest.xml)
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/ShadeWidget.apk --clobber
          else
            gh release create "$TAG" dist/ShadeWidget.apk \
              --target "$GITHUB_SHA" \
              --title "Shade Widget $VERSION" \
              --notes-file .github/release-notes.md --latest
          fi
